name: Test-CI
run-name: Test CI
on:
  push:
    branches:
      - feature/p7-gh-actions
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-api, authz-service, transactions-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup node version
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dependencies install
        run: npm i
        working-directory: ./P5/services/${{ matrix.service }}

      - name: Compile
        run: npm run build
        working-directory: ./P5/services/${{ matrix.service }}

      - name: Test
        run: node --test
        working-directory: ./P5/services/${{ matrix.service }}

  build_python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup python version
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Dependencies install
        run: pip install -r requirements.txt && pip install -r requirements-dev.txt
        working-directory: ./P5/services/audit-service

      - name: Test
        run: pytest
        working-directory: ./P5/services/audit-service
  publish_docker:
    needs: [build, build_python]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: auth-api
            context: ./P5/services/auth-api
          - image: authz-service
            context: ./P5/services/authz-service
          - image: transactions-service
            context: ./P5/services/transactions-service
          - image: audit-service
            context: ./P5/services/audit-service
          - image: cronjobs
            context: ./P5/scripts/cronjobs
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}'
          platforms: linux/amd64
  deploy:
    needs: publish_docker
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          service_account: github-actions-deploy@softwareavanz.iam.gserviceaccount.com
          project_id: 'softwareavanz'
          workload_identity_provider: 'projects/558971310301/locations/global/workloadIdentityPools/github-pool/providers/github-provider'

      - name: test auth
        run: gcloud auth list
