name: Test-CI
run-name: Test CI
on:
  push:
    branches:
      - feature/p7-gh-actions
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup node version
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dependencies install
        run: npm i
        working-directory: ./P5/services/auth-api

      - name: Compilar
        run: npm run build
        working-directory: ./P5/services/auth-api
