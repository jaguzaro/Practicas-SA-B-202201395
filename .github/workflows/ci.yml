name: Test-CI
run-name: Test CI
on:
  push:
    branches:
      - feature/p7-gh-actions
jobs:
  build:
    strategy:
      matrix:
        service: [auth-api, authz-service, transactions-service]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup node version
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dependencies install
        run: npm i
        working-directory: ./P5/services/${{ matrix.service }}

      - name: Compile
        run: npm run build
        working-directory: ./P5/services/${{ matrix.service }}
  build_python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup python version
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Dependencies install
        run: pip install -r requirements.txt
        working-directory: ./P5/services/audit-service
