apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-plataforma
  namespace: observabilidad
  labels:
    release: prometheus
spec:
  groups:
    - name: slo.indicadores
      interval: 30s
      rules:
        - record: slo:disponibilidad:ratio5m
          expr: |
            sum(rate(http_server_requests_total{namespace="sa-p8",familia!="5xx"}[5m]))
            /
            sum(rate(http_server_requests_total{namespace="sa-p8"}[5m]))

        - record: slo:disponibilidad:ratio30d
          expr: |
            sum(increase(http_server_requests_total{namespace="sa-p8",familia!="5xx"}[30d]))
            /
            sum(increase(http_server_requests_total{namespace="sa-p8"}[30d]))

        - record: slo:latencia:ratio5m
          expr: |
            sum(rate(http_server_duration_seconds_bucket{namespace="sa-p8",servicio="transactions-service",le="0.5"}[5m]))
            /
            sum(rate(http_server_duration_seconds_count{namespace="sa-p8",servicio="transactions-service"}[5m]))

        - record: slo:latencia:ratio30d
          expr: |
            sum(increase(http_server_duration_seconds_bucket{namespace="sa-p8",servicio="transactions-service",le="0.5"}[30d]))
            /
            sum(increase(http_server_duration_seconds_count{namespace="sa-p8",servicio="transactions-service"}[30d]))

    - name: slo.presupuesto
      interval: 30s
      rules:
        - record: slo:disponibilidad:presupuesto_consumido
          expr: (1 - slo:disponibilidad:ratio30d) / (1 - 0.995)

        - record: slo:latencia:presupuesto_consumido
          expr: (1 - slo:latencia:ratio30d) / (1 - 0.99)

        - record: slo:disponibilidad:quema1h
          expr: |
            (
              1 - (
                sum(rate(http_server_requests_total{namespace="sa-p8",familia!="5xx"}[1h]))
                /
                sum(rate(http_server_requests_total{namespace="sa-p8"}[1h]))
              )
            ) / (1 - 0.995)

        - record: slo:disponibilidad:quema6h
          expr: |
            (
              1 - (
                sum(rate(http_server_requests_total{namespace="sa-p8",familia!="5xx"}[6h]))
                /
                sum(rate(http_server_requests_total{namespace="sa-p8"}[6h]))
              )
            ) / (1 - 0.995)

        - record: slo:latencia:quema1h
          expr: |
            (
              1 - (
                sum(rate(http_server_duration_seconds_bucket{namespace="sa-p8",servicio="transactions-service",le="0.5"}[1h]))
                /
                sum(rate(http_server_duration_seconds_count{namespace="sa-p8",servicio="transactions-service"}[1h]))
              )
            ) / (1 - 0.99)

        - record: slo:latencia:quema6h
          expr: |
            (
              1 - (
                sum(rate(http_server_duration_seconds_bucket{namespace="sa-p8",servicio="transactions-service",le="0.5"}[6h]))
                /
                sum(rate(http_server_duration_seconds_count{namespace="sa-p8",servicio="transactions-service"}[6h]))
              )
            ) / (1 - 0.99)
