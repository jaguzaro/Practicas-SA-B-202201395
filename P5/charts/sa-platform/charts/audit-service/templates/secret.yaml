apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secret
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    app: {{ .Chart.Name }}
    {{- include "sa-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "Debe indicar global.credentials.jwtSecret" .Values.global.credentials.jwtSecret | quote }}
  {{- if .Values.database }}
  DATABASE_URL: {{ include "sa-platform.databaseUrl" (dict "ctx" . "database" .Values.database) | quote }}
  {{- end }}
  {{- if .Values.needsAesKey }}
  AES_SECRET_KEY: {{ required "Debe indicar global.credentials.aesSecretKey" .Values.global.credentials.aesSecretKey | quote }}
  {{- end }}
  {{- if .Values.needsBroker }}
  BROKER_URL: {{ include "sa-platform.brokerUrl" . | quote }}
  {{- end }}
