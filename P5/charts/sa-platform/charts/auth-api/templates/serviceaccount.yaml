apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    app: {{ .Chart.Name }}
    {{- include "sa-platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    app: {{ .Chart.Name }}
    {{- include "sa-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.rbac.configMapName | default (printf "%s-config" .Chart.Name) | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    app: {{ .Chart.Name }}
    {{- include "sa-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Chart.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Chart.Name }}
    namespace: {{ include "sa-platform.namespace" . }}
