apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    app: {{ .Chart.Name }}
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
