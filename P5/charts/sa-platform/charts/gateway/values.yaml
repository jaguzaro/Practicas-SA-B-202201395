replicaCount: 1

image:
  repository: kong
  tag: "3.9"
  pullPolicy: IfNotPresent

service:
  port: 8000

logLevel: notice

workerProcesses: 2

routes: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

podDisruptionBudget:
  minAvailable: 1

securityContext:
  runAsUser: 1000

rbac:
  configMapName: gateway-declarative

probes:
  path: /status
  startup:
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
