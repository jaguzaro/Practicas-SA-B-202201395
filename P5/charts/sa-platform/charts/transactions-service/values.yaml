replicaCount: 1

image:
  repository: sa-transactions-service
  tag: 1.0.0
  pullPolicy: IfNotPresent

service:
  port: 4002

logLevel: info

database: transactionsdb

config:
  AUTHZ_SERVICE_URL: http://authz-service:4001
  AUDIT_SERVICE_URL: http://audit-service:4005
  MAX_TRANSACTION_AMOUNT: "50000"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

podDisruptionBudget:
  minAvailable: 1

securityContext:
  runAsUser: 1001

rbac:
  configMapName: ""

probes:
  path: /health
  startup:
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi
