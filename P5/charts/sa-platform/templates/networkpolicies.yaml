apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: denegar-todo-por-defecto
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-desde-ingress
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ index .Values "gateway" "service" "port" }}
    - ports:
        - protocol: TCP
          port: 8100
---
{{- range $nombre, $servicio := .Values.microservicios }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-solo-autorizados" $nombre }}
  namespace: {{ include "sa-platform.namespace" $ }}
  labels:
    {{- include "sa-platform.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ $nombre }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      {{- range $servicio.permitirDesde }}
        - podSelector:
            matchLabels:
              app: {{ . }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ $servicio.puerto }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-solo-autorizados
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
      {{- range .Values.accesoDatos.postgres }}
        - podSelector:
            matchLabels:
              app: {{ . }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-solo-autorizados
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
      {{- range .Values.accesoDatos.rabbitmq }}
        - podSelector:
            matchLabels:
              app: {{ . }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 5672
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
