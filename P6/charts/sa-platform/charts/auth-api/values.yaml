replicaCount: 1

image:
  repository: sa-auth-api
  tag: 1.0.0
  pullPolicy: IfNotPresent

service:
  port: 4000

logLevel: info

database: authdb

needsAesKey: true

config:
  JWT_EXPIRATION: 60m
  JWT_GRACE_PERIOD: 10m
  FRONTEND_ORIGIN: http://localhost:8000

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

podDisruptionBudget:
  minAvailable: 1

securityContext:
  runAsUser: 1001

rbac:
  configMapName: ""

probes:
  path: /health
  startup:
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi
