apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    app: {{ .Chart.Name }}
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app: {{ .Chart.Name }}
  ports:
    - name: proxy
      port: {{ .Values.service.port }}
      targetPort: proxy
