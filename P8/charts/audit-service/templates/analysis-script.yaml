apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-analisis
  labels:
    app: {{ .Chart.Name }}
    {{- include "servicio.labels" . | nindent 4 }}
data:
  humo.js: |
    import http from "k6/http";
    import { check } from "k6";

    const rutas = JSON.parse(__ENV.RUTAS);
    const base = __ENV.BASE_URL;

    export const options = {
      vus: Number(__ENV.VUS),
      duration: __ENV.DURACION,
      thresholds: {
        http_req_failed: [`rate<${__ENV.TASA_ERROR_MAX}`],
        http_req_duration: [`p(95)<${__ENV.P95_MS}`],
        checks: ["rate>0.99"],
      },
    };

    export default function () {
      for (const ruta of rutas) {
        const cuerpo = ruta.body ? JSON.stringify(ruta.body) : null;
        const res = http.request(ruta.method, `${base}${ruta.path}`, cuerpo, {
          headers: { "Content-Type": "application/json" },
          responseCallback: http.expectedStatuses(ruta.status),
        });
        check(res, {
          [`${ruta.method} ${ruta.path} responde ${ruta.status}`]: (r) => r.status === ruta.status,
        });
      }
    }
