apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Chart.Name }}-canary
  labels:
    app: {{ .Chart.Name }}
    {{- include "servicio.labels" . | nindent 4 }}
spec:
  args:
    - name: servicio
      value: {{ .Chart.Name | quote }}
    - name: namespace
      value: {{ .Release.Namespace | quote }}
    - name: version-pod
  metrics:
    - name: tasa-de-error
      initialDelay: {{ .Values.analisis.esperaInicial }}
      interval: {{ .Values.analisis.intervalo }}
      count: {{ .Values.analisis.mediciones }}
      failureLimit: {{ .Values.analisis.fallosTolerados }}
      successCondition: result[0] <= {{ .Values.analisis.umbrales.tasaErrorMax }}
      provider:
        prometheus:
          address: {{ .Values.analisis.prometheus }}
          query: |
            sum(
              rate(http_server_requests_total{
                namespace="{{ "{{args.namespace}}" }}",
                servicio="{{ "{{args.servicio}}" }}",
                version_pod="{{ "{{args.version-pod}}" }}",
                familia="5xx"
              }[{{ .Values.analisis.ventana }}])
            )
            /
            clamp_min(
              sum(
                rate(http_server_requests_total{
                  namespace="{{ "{{args.namespace}}" }}",
                  servicio="{{ "{{args.servicio}}" }}",
                  version_pod="{{ "{{args.version-pod}}" }}"
                }[{{ .Values.analisis.ventana }}])
              ),
              0.001
            )

    - name: latencia-p95
      initialDelay: {{ .Values.analisis.esperaInicial }}
      interval: {{ .Values.analisis.intervalo }}
      count: {{ .Values.analisis.mediciones }}
      failureLimit: {{ .Values.analisis.fallosTolerados }}
      successCondition: result[0] <= {{ .Values.analisis.umbrales.p95Segundos }}
      provider:
        prometheus:
          address: {{ .Values.analisis.prometheus }}
          query: |
            histogram_quantile(0.95,
              sum by (le) (
                rate(http_server_duration_seconds_bucket{
                  namespace="{{ "{{args.namespace}}" }}",
                  servicio="{{ "{{args.servicio}}" }}",
                  version_pod="{{ "{{args.version-pod}}" }}"
                }[{{ .Values.analisis.ventana }}])
              )
            )
