replicaCount: 1

image:
  repository: ghcr.io/jaguzaro/authz-service
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4001

logLevel: info

secret:
  name: ""

config: {}

telemetria:
  destinoTrazas: http://otel-collector.observabilidad:4318
  puertoMetricas: 9464
  podMonitor: true

analisis:
  prometheus: http://prometheus-kube-prometheus-prometheus.observabilidad:9090
  esperaInicial: 45s
  intervalo: 20s
  mediciones: 2
  fallosTolerados: 0
  ventana: 90s
  umbrales:
    tasaErrorMax: "0.02"
    p95Segundos: "0.5"

rollout:
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  pasos:
    - 20
    - 50
    - 80
  esperaAntesDeAnalisis: 15s


autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

securityContext:
  runAsUser: 1001

probes:
  path: /health
  startup:
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: authz-service
