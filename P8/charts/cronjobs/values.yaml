image:
  repository: ghcr.io/jaguzaro/cronjobs
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

carne: "202201395"
summaryQueue: audit.summaries
timeZone: America/Guatemala

secret:
  name: ""

securityContext:
  runAsUser: 1001

backoffLimit: 3
ttlSecondsAfterFinished: 300
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

trabajos:
  cronjob-registro:
    schedule: "*/2 * * * *"
    script: registrar_ejecucion.py
  cronjob-resumen:
    schedule: "*/10 * * * *"
    script: publicar_resumen.py

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 192Mi
