postgresql:
  fullnameOverride: postgres
  global:
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r4
  auth:
    username: sa
    database: postgres
    existingSecret: datos-postgresql
  primary:
    networkPolicy:
      enabled: false
    persistence:
      enabled: true
      size: 1Gi
    initdb:
      scripts:
        01-databases.sql: |
          CREATE DATABASE authdb;
          CREATE DATABASE transactionsdb;
          CREATE DATABASE auditdb;
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 512Mi

rabbitmq:
  fullnameOverride: rabbitmq
  networkPolicy:
    enabled: false
  global:
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1
  auth:
    username: sa
    existingPasswordSecret: datos-rabbitmq
    existingErlangSecret: datos-rabbitmq
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 640Mi
