apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    {{- include "servicio.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  strategy:
    canary:
      canaryService: {{ .Chart.Name }}-canary
      stableService: {{ .Chart.Name }}
      maxUnavailable: 0
      maxSurge: 1
      steps:
        {{- range .Values.rollout.pasos }}
        - setWeight: {{ . }}
        - pause:
            duration: {{ $.Values.rollout.esperaAntesDeAnalisis }}
        - analysis:
            templates:
              - templateName: {{ $.Chart.Name }}-canary
        {{- end }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
        {{- include "servicio.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      automountServiceAccountToken: false
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        fsGroup: {{ .Values.securityContext.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "servicio.imagen" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: proxy
              containerPort: {{ .Values.service.port }}
            - name: status
              containerPort: 8100
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/kong/kong.yml"
            - name: KONG_PROXY_LISTEN
              value: {{ printf "0.0.0.0:%v" .Values.service.port | quote }}
            - name: KONG_ADMIN_LISTEN
              value: "off"
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"
            - name: KONG_LOG_LEVEL
              value: {{ .Values.logLevel | default "notice" | quote }}
            - name: KONG_NGINX_WORKER_PROCESSES
              value: {{ .Values.workerProcesses | default 2 | quote }}
            - name: KONG_PREFIX
              value: "/kong_prefix"
          startupProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: declarative
              mountPath: /kong
              readOnly: true
            - name: prefix
              mountPath: /kong_prefix
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: declarative
          configMap:
            name: {{ .Chart.Name }}-declarative
        - name: prefix
          emptyDir: {}
        - name: tmp
          emptyDir: {}
