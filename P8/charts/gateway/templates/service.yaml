apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    {{- include "servicio.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  {{- if .Values.service.trafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.trafficPolicy }}
  {{- end }}
  selector:
    app: {{ .Chart.Name }}
  ports:
    - name: proxy
      port: {{ .Values.service.port }}
      targetPort: proxy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-canary
  labels:
    app: {{ .Chart.Name }}
    {{- include "servicio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
  ports:
    - name: proxy
      port: {{ .Values.service.port }}
      targetPort: proxy
