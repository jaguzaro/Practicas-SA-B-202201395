replicaCount: 1

image:
  repository: ghcr.io/jaguzaro/transactions-service
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4002

logLevel: info

secret:
  name: ""

config:
  AUTHZ_SERVICE_URL: http://authz-service:4001
  AUDIT_SERVICE_URL: http://audit-service:4005
  MAX_TRANSACTION_AMOUNT: "50000"
  AUDIT_QUEUE: audit.events

telemetria:
  destinoTrazas: http://otel-collector.observabilidad:4318
  puertoMetricas: 9464
  podMonitor: true

analisis:
  prometheus: http://prometheus-kube-prometheus-prometheus.observabilidad:9090
  esperaInicial: 120s
  intervalo: 30s
  mediciones: 4
  fallosTolerados: 0
  ventana: 2m
  umbrales:
    tasaErrorMax: "0.02"
    p95Segundos: "0.5"

rollout:
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  pasos:
    - 20
    - 50
    - 80
  esperaAntesDeAnalisis: 15s


autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

securityContext:
  runAsUser: 1001

probes:
  path: /health
  startup:
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi
