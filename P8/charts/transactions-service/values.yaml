replicaCount: 1

image:
  repository: ghcr.io/jaguzaro/transactions-service
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4002

logLevel: info

secret:
  name: ""

config:
  AUTHZ_SERVICE_URL: http://authz-service:4001
  AUDIT_SERVICE_URL: http://audit-service:4005
  MAX_TRANSACTION_AMOUNT: "50000"
  AUDIT_QUEUE: audit.events

rollout:
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  pasos:
    - 20
    - 50
    - 80
  esperaAntesDeAnalisis: 15s

analysis:
  image: grafana/k6:0.54.0
  vus: 5
  duracion: 20s
  ttlSecondsAfterFinished: 900
  umbrales:
    tasaErrorMax: "0.01"
    p95Ms: 500
  rutas:
    - method: GET
      path: /health
      status: 200
    - method: GET
      path: /transactions/batches
      status: 401
    - method: POST
      path: /transactions/batches
      status: 401
      body:
        transactions: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

securityContext:
  runAsUser: 1001

probes:
  path: /health
  startup:
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi
