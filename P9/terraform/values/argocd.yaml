configs:
  params:
    server.insecure: true

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0

controller:
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 2Gi

server:
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 1Gi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
